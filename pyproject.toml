[project]
name = "mac-health-checkup"
version = "0.2.0"
description = "macOS diagnostics dashboard that gathers read-only system data and renders a resilient UI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mac-health-checkup = "mac_health_checkup.app.entrypoint:main"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["benchmarks/baseline.json"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_any_unimported = true
disallow_any_generics = true
disallow_any_explicit = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false

[tool.coverage.run]
branch = true
source = ["mac_health_checkup"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
