[build-system]
requires = ["setuptools>=83", "wheel>=0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-health-checkup"
version = "0.2.0"
description = "Local-first macOS diagnostics for SwiftUI, Tk, CLI, automation, and an optional iOS companion."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
keywords = ["macos", "diagnostics", "system-monitoring", "swiftui", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Monitoring",
]

[project.urls]
Repository = "https://github.com/hydroLB/Mac_Health_Checkup"
Issues = "https://github.com/hydroLB/Mac_Health_Checkup/issues"
Changelog = "https://github.com/hydroLB/Mac_Health_Checkup/blob/main/CHANGELOG.md"

[project.scripts]
mac-health-checkup = "mac_health_checkup.app.entrypoint:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mac_health_checkup*"]
namespaces = false

[tool.setuptools.package-data]
"mac_health_checkup.resources" = ["*.json"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["benchmarks/baseline.json"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_any_unimported = true
disallow_any_generics = true
disallow_any_explicit = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false

[tool.coverage.run]
branch = true
parallel = true
source = ["mac_health_checkup"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
