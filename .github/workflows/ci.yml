name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  quality:
    runs-on: macos-latest
    env:
      PYTHONPATH: .
      PIP_AUDIT_CACHE_DIR: .local/pip-audit-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Typecheck
        run: mypy mac_health_checkup tests

      - name: Docstrings
        run: python tools/check_docstring_headings.py mac_health_checkup tests

      - name: Config reference
        run: python tools/generate_config_reference.py --config config/config.json --out docs/config_reference.md --check

      - name: Tests
        run: pytest --cov=mac_health_checkup --cov-report=term-missing --cov-report=xml

      - name: Visual regression baseline capture
        run: python tools/gui_visual_regression.py capture --output-dir .local/visual-regression/baseline

      - name: Visual regression candidate capture
        run: python tools/gui_visual_regression.py capture --output-dir .local/visual-regression/candidate

      - name: Visual regression diff gate
        run: |
          python tools/gui_visual_regression.py diff \
            --before-dir .local/visual-regression/baseline \
            --after-dir .local/visual-regression/candidate \
            --diff-dir .local/visual-regression/diff \
            --fail-on-change

      - name: Benchmarks
        run: python benchmarks/run.py

      - name: Security (Bandit)
        run: bandit -r mac_health_checkup

      - name: Security (pip-audit)
        run: pip-audit -r requirements-dev.txt -r requirements.txt

      - name: Secret scan (detect-secrets)
        run: python -m detect_secrets scan --all-files --baseline .secrets.baseline

      - name: SwiftUI (Build + Tests)
        run: |
          mkdir -p .local/swiftpm/scratch .local/swiftpm/cache .local/swiftpm/config .local/swiftpm/security .local/swiftpm/clang-module-cache
          CLANG_MODULE_CACHE_PATH="$PWD/.local/swiftpm/clang-module-cache" \
            swift test --package-path swift-ui --manifest-cache local --disable-sandbox \
              --scratch-path .local/swiftpm/scratch --cache-path .local/swiftpm/cache \
              --config-path .local/swiftpm/config --security-path .local/swiftpm/security

      - name: iOS (Build)
        run: |
          mkdir -p .local/DerivedData .local/SourcePackages
          xcodebuild \
            -project ios/MacHealthCheckupMobile/MacHealthCheckupMobile.xcodeproj \
            -scheme MacHealthCheckupMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath .local/DerivedData \
            -clonedSourcePackagesDirPath .local/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            build
