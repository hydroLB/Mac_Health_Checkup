name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  quality:
    runs-on: macos-latest
    env:
      PYTHONPATH: .
      PIP_AUDIT_CACHE_DIR: .local/pip-audit-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: make setup

      - name: Quality gates (make check)
        run: make check
