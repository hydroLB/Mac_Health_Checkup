name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Pull requests always execute on an isolated, ephemeral GitHub-hosted runner.
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .
      PIP_AUDIT_CACHE_DIR: .local/pip-audit-cache
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: make setup

      - name: Quality gates (make check)
        run: make check
