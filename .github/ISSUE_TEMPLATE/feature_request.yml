name: Feature request
description: Propose a scoped enhancement with clear user value.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: input
    id: problem
    attributes:
      label: Problem statement
      description: What user or operator problem is not solved today?
      placeholder: Operators cannot export snapshot diff metadata as JSON for automation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest viable approach.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include rejected options and tradeoffs.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Measurable criteria for done.
      placeholder: |
        - New CLI flag documented
        - Unit tests for parser and export payload
        - make check passes
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact area
      options:
        - Diagnostics
        - GUI
        - Backend API
        - iOS app
        - Tooling/CI
        - Documentation
        - Other
    validations:
      required: true
